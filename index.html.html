<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR System — ဝန်ထမ်း စီမံခန့်ခွဲမှုစနစ်</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#14213D; --ink-soft:#1F2E52; --brass:#C89B3C; --brass-soft:#E8D6A8;
    --parchment:#FAF8F4; --paper:#FFFFFF; --sage:#4C7A5C; --rust:#B54834;
    --slate:#6B7280; --line:#E4DFD3; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Noto Sans Myanmar', sans-serif; background:var(--parchment); color:var(--ink); min-height:100vh;}
  .mono{font-family:'JetBrains Mono', monospace;}
  .hidden{display:none !important;}

  /* ---------------- Shared top bar ---------------- */
  .topbar{position:sticky; top:0; z-index:50; background:var(--ink); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .topbar .brand{color:var(--parchment); font-weight:700; font-size:.95rem; display:flex; align-items:center; gap:6px;}
  .role-tabs{display:flex; border:1px solid rgba(255,255,255,.25); border-radius:100px; overflow:hidden;}
  .role-tabs button{all:unset; cursor:pointer; padding:8px 16px; font-size:.8rem; font-weight:700; color:rgba(250,248,244,.7); font-family:'Noto Sans Myanmar', sans-serif;}
  .role-tabs button.active{background:var(--brass); color:var(--ink);}
  .lang-toggle{display:flex; border:1px solid rgba(255,255,255,.25); border-radius:100px; overflow:hidden;}
  .lang-toggle button{all:unset; cursor:pointer; padding:8px 14px; font-size:.75rem; font-weight:700; color:rgba(250,248,244,.7);}
  .lang-toggle button.active{background:var(--parchment); color:var(--ink);}

  /* ================= EMPLOYEE SECTION ================= */
  #employeeSection{padding:24px 16px 60px;}
  .wrap{max-width:920px; margin:0 auto; display:grid; gap:22px;}

  .reg-overlay{max-width:520px; margin:40px auto; background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:34px 30px;}
  .reg-overlay h2{font-size:1.15rem; font-weight:700; margin-bottom:6px;}
  .reg-overlay .sub{font-size:.83rem; color:var(--slate); margin-bottom:22px;}
  .reg-overlay label.fld{display:block; font-size:.75rem; color:var(--slate); margin-bottom:6px; margin-top:14px;}
  .reg-overlay input, .reg-overlay select{width:100%; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-family:'Noto Sans Myanmar', sans-serif; font-size:.9rem; color:var(--ink);}
  .reg-overlay button.btn-solid{width:100%; margin-top:22px; padding:13px; font-size:.92rem;}
  .toggle-mode{text-align:center; margin-top:16px; font-size:.8rem; color:var(--slate);}
  .toggle-mode button{all:unset; cursor:pointer; color:var(--ink); font-weight:700; text-decoration:underline;}
  .company-pill{display:inline-flex; align-items:center; gap:8px; background:var(--parchment); border:1px solid var(--line); border-radius:100px; padding:6px 14px; font-size:.78rem; margin-bottom:18px;}
  .company-pill button{all:unset; cursor:pointer; color:var(--rust); font-weight:700; text-decoration:underline; font-size:.75rem;}

  .stamp-card{background:var(--ink); color:var(--parchment); border-radius:20px; padding:36px 28px; position:relative; overflow:hidden; text-align:center;}
  .stamp-card::before{content:""; position:absolute; inset:0; background:radial-gradient(circle at 85% -10%, rgba(200,155,60,.28), transparent 45%), radial-gradient(circle at -10% 110%, rgba(200,155,60,.16), transparent 45%);}
  .stamp-card .company-name{position:relative; font-size:.78rem; color:var(--brass-soft); letter-spacing:.5px; text-transform:uppercase; margin-bottom:4px;}
  .stamp-card .clock{font-family:'JetBrains Mono', monospace; font-size:clamp(2.4rem, 8vw, 3.6rem); font-weight:700; letter-spacing:1px; position:relative;}
  .stamp-card .date{position:relative; margin-top:6px; color:var(--brass-soft); font-size:.95rem;}

  .who-row{position:relative; margin-top:22px; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;}
  .who-name{font-size:1rem; font-weight:700;}
  .who-position{font-size:.78rem; color:var(--brass-soft);}
  .switch-link{font-size:.75rem; color:var(--brass-soft); text-decoration:underline; cursor:pointer; background:none; border:none;}

  .stamp-actions{position:relative; margin-top:24px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .stamp-btn{font-family:'Noto Sans Myanmar', sans-serif; font-weight:700; font-size:1rem; padding:16px 34px; border-radius:100px; border:2px solid transparent; cursor:pointer; transition:transform .15s ease, opacity .15s ease;}
  .stamp-btn:active{transform:scale(.97);}
  .stamp-btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn-in{background:var(--brass); color:var(--ink);}
  .btn-out{background:transparent; color:var(--parchment); border-color:rgba(255,255,255,.4);}

  .status-line{position:relative; margin-top:20px; font-size:.85rem; color:var(--brass-soft); min-height:1.2em;}
  .schedule-note{position:relative; margin-top:8px; font-size:.72rem; color:rgba(250,248,244,.5);}

  .card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:22px 22px 20px;}
  .card h2{font-size:1rem; font-weight:700; margin-bottom:4px;}
  .card h3{font-size:.95rem; font-weight:700; margin-bottom:14px;}
  .card .sub{font-size:.78rem; color:var(--slate); margin-bottom:16px;}
  .card .hint{font-size:.78rem; color:var(--slate); margin-bottom:16px; margin-top:-6px;}

  .today-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .today-box{border:1px dashed var(--line); border-radius:10px; padding:14px; text-align:center;}
  .today-box .lbl{font-size:.7rem; color:var(--slate); text-transform:uppercase; letter-spacing:.5px;}
  .today-box .val{font-family:'JetBrains Mono', monospace; font-size:1.25rem; font-weight:700; margin-top:6px; color:var(--ink);}
  .today-box .val.empty{color:var(--line); font-weight:500;}
  .today-box .val.warn{color:var(--rust);}
  .today-box .val.good{color:var(--sage);}

  textarea{width:100%; min-height:80px; resize:vertical; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-family:'Noto Sans Myanmar', sans-serif; font-size:.9rem; color:var(--ink);}
  .row{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:flex-start;}
  input#hoursInput, input#otHours{width:110px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-family:'JetBrains Mono', monospace; font-size:.85rem;}
  .btn-solid{background:var(--ink); color:var(--parchment); border:none; border-radius:10px; padding:10px 20px; font-family:'Noto Sans Myanmar', sans-serif; font-weight:600; font-size:.85rem; cursor:pointer;}
  .btn-solid:hover{background:var(--ink-soft);}
  .btn-solid.ot{background:var(--brass); color:var(--ink);}

  ul.log-list{list-style:none; margin-top:16px; display:grid; gap:8px;}
  ul.log-list li{border-left:3px solid var(--brass); background:var(--parchment); padding:10px 12px; border-radius:0 8px 8px 0; font-size:.85rem;}
  ul.log-list li .meta{font-size:.7rem; color:var(--slate); margin-top:3px; font-family:'JetBrains Mono', monospace;}

  .divider{border-top:1px dashed var(--line); margin:20px 0 16px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  select, input[type=date]{width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-family:'Noto Sans Myanmar', sans-serif; font-size:.85rem; color:var(--ink);}
  label.fld{display:block; font-size:.72rem; color:var(--slate); margin-bottom:5px;}

  .leave-list{margin-top:16px; display:grid; gap:8px;}
  .leave-item{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:var(--parchment); font-size:.82rem; flex-wrap:wrap;}
  .badge{font-size:.68rem; font-weight:700; padding:3px 10px; border-radius:100px; text-transform:uppercase; letter-spacing:.4px;}
  .badge.pending{background:#F3E6C9; color:#8A6416;}
  .badge.approved{background:#DCEAE0; color:var(--sage);}
  .badge.rejected{background:#F3DAD3; color:var(--rust);}
  .badge.present{background:#DCEAE0; color:var(--sage);}
  .badge.late{background:#F3E6C9; color:#8A6416;}
  .badge.absent{background:#F3DAD3; color:var(--rust);}
  .badge.on_leave{background:#E4E0F3; color:#5B4C9E;}

  .balance-note{font-size:.78rem; color:var(--slate); padding:10px 12px; background:var(--parchment); border-radius:10px; width:100%;}
  .balance-note.warn{color:var(--rust); font-weight:600;}
  .balance-note.good{color:var(--sage);}

  @media(max-width:520px){
    .today-grid{grid-template-columns:1fr;}
    .grid2{grid-template-columns:1fr;}
  }

  /* ================= ADMIN SECTION ================= */
  .gate-wrap{min-height:calc(100vh - 54px); display:flex; align-items:center; justify-content:center; padding:24px;}
  .gate-card{max-width:460px; width:100%; background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:34px 30px;}
  .gate-card h1{font-size:1.2rem; font-weight:700; margin-bottom:4px;}
  .gate-card .sub{font-size:.82rem; color:var(--slate); margin-bottom:20px;}
  .gate-tabs{display:flex; border:1px solid var(--line); border-radius:100px; overflow:hidden; margin-bottom:22px;}
  .gate-tabs button{all:unset; flex:1; text-align:center; cursor:pointer; padding:10px; font-size:.82rem; font-weight:700; color:var(--slate);}
  .gate-tabs button.active{background:var(--ink); color:var(--parchment);}
  .gate-card label.fld{display:block; font-size:.75rem; color:var(--slate); margin-bottom:6px; margin-top:14px;}
  .gate-card input{width:100%; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-family:'Noto Sans Myanmar', sans-serif; font-size:.9rem; color:var(--ink);}
  .gate-card button.btn-solid{width:100%; margin-top:22px; padding:13px; font-size:.92rem; background:var(--ink); color:var(--parchment); border:none; border-radius:10px; font-weight:600; cursor:pointer; font-family:'Noto Sans Myanmar', sans-serif;}
  .gate-card button.btn-solid:hover{background:var(--ink-soft);}
  .gate-hint{font-size:.75rem; color:var(--slate); margin-top:14px; text-align:center;}

  .shell{display:flex; min-height:calc(100vh - 54px);}
  nav.side{width:230px; background:var(--ink); color:var(--parchment); padding:26px 16px; display:flex; flex-direction:column; gap:4px; flex-shrink:0;}
  nav.side .sub{font-size:.7rem; color:var(--brass-soft); margin-bottom:18px;}
  nav.side button.nav-btn{all:unset; cursor:pointer; padding:11px 14px; border-radius:10px; font-size:.85rem; color:rgba(250,248,244,.75); transition:background .15s;}
  nav.side button.nav-btn:hover{background:rgba(255,255,255,.06); color:var(--parchment);}
  nav.side button.nav-btn.active{background:var(--brass); color:var(--ink); font-weight:700;}
  nav.side button.back{margin-top:auto; font-size:.75rem; color:var(--brass-soft); padding:11px 14px; background:none; border:none; cursor:pointer; font-family:'Noto Sans Myanmar', sans-serif; text-align:left;}

  main{flex:1; padding:32px 36px; max-width:1150px;}
  main h2{font-size:1.3rem; font-weight:700; margin-bottom:4px;}
  main .sub{font-size:.82rem; color:var(--slate); margin-bottom:22px;}

  .panel{display:none;}
  .panel.active{display:block;}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
  .stat{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
  .stat .n{font-family:'JetBrains Mono', monospace; font-size:1.7rem; font-weight:700;}
  .stat .l{font-size:.75rem; color:var(--slate); margin-top:2px;}

  table{width:100%; border-collapse:collapse; font-size:.85rem;}
  th{text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.4px; color:var(--slate); padding:8px 10px; border-bottom:1px solid var(--line);}
  td{padding:10px 10px; border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  td.mono, th.mono{font-family:'JetBrains Mono', monospace; font-size:.8rem;}
  .ot-tag{font-family:'JetBrains Mono', monospace; font-size:.78rem; color:var(--brass); font-weight:700;}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
  .btn{background:var(--ink); color:var(--parchment); border:none; border-radius:10px; padding:10px 20px; font-weight:600; font-size:.85rem; cursor:pointer; font-family:'Noto Sans Myanmar', sans-serif;}
  .btn:hover{background:var(--ink-soft);}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn.small{padding:6px 14px; font-size:.75rem; border-radius:8px;}
  .btn.approve{background:var(--sage); color:#fff;}
  .btn.reject{background:var(--rust); color:#fff;}
  .actions{display:flex; gap:8px;}

  .pos-tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .pos-tag{background:var(--parchment); border:1px solid var(--line); border-radius:100px; padding:6px 14px; font-size:.78rem; display:flex; align-items:center; gap:8px;}
  .pos-tag button{all:unset; cursor:pointer; color:var(--rust); font-weight:700; font-size:.9rem;}

  .saved-toast{display:inline-block; margin-left:12px; font-size:.78rem; color:var(--sage); font-weight:600; opacity:0; transition:opacity .3s;}
  .saved-toast.show{opacity:1;}

  .company-badge{font-size:.72rem; color:var(--brass-soft); margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,.12);}
  .company-badge b{color:var(--parchment); display:block; font-size:.88rem; margin-bottom:2px;}

  @media(max-width:800px){
    .topbar{padding:10px 12px;}
    .shell{flex-direction:column;}
    nav.side{width:100%; flex-direction:row; overflow-x:auto; padding:14px; align-items:center;}
    nav.side .sub, nav.side button.back, .company-badge{display:none;}
    .stat-row{grid-template-columns:1fr 1fr;}
    .form-grid{grid-template-columns:1fr;}
    main{padding:20px;}
  }
</style>
</head>
<body>

<!-- ============ SHARED TOP BAR ============ -->
<div class="topbar">
  <div class="brand">🏢 <span data-i18n="brandTitle"></span></div>
  <div class="role-tabs">
    <button id="roleEmpBtn" class="active" data-i18n="roleEmpTab"></button>
    <button id="roleAdminBtn" data-i18n="roleAdminTab"></button>
  </div>
  <div class="lang-toggle">
    <button id="langMy" data-lang="my">မြန်မာ</button>
    <button id="langEn" data-lang="en">English</button>
  </div>
</div>

<!-- ======================================================
     EMPLOYEE SECTION
====================================================== -->
<div id="employeeSection">
<div class="wrap">

  <!-- STEP 0: COMPANY GATE -->
  <div class="reg-overlay" id="companyGate">
    <h2>🏢 <span data-i18n="companyGateTitle"></span></h2>
    <div class="sub" data-i18n="companyGateSub"></div>
    <label class="fld" data-i18n="companyCodeLabel"></label>
    <input type="text" id="companyCodeInput" data-i18n-ph="companyCodePh">
    <button class="btn-solid" id="companyContinueBtn" data-i18n="continueBtn"></button>
    <div class="toggle-mode" data-i18n="companyGateHint"></div>
  </div>

  <!-- STEP 1: REGISTER / LOGIN -->
  <div class="reg-overlay hidden" id="regOverlay">
    <div class="company-pill">
      🏢 <span id="companyPillName"></span>
      <button id="changeCompanyBtn" data-i18n="changeCompanyBtn"></button>
    </div>

    <div id="registerBlock">
      <h2>👋 <span data-i18n="welcomeTitle"></span></h2>
      <div class="sub" data-i18n="welcomeSub"></div>
      <label class="fld" data-i18n="nameLabel"></label>
      <input type="text" id="regName" data-i18n-ph="namePh">
      <label class="fld" data-i18n="positionLabel"></label>
      <select id="regPosition"></select>
      <label class="fld" data-i18n="codeLabel"></label>
      <input type="text" id="regCode" data-i18n-ph="codePh">
      <label class="fld" data-i18n="phoneLabel"></label>
      <input type="text" id="regPhone" data-i18n-ph="phonePh">
      <button class="btn-solid" id="regSubmitBtn" data-i18n="startBtn"></button>
      <div class="toggle-mode">
        <span data-i18n="haveCodeText"></span> <button id="showLoginBtn" data-i18n="haveCodeBtn"></button>
      </div>
    </div>

    <div id="loginBlock" class="hidden">
      <h2>🔑 <span data-i18n="loginTitle"></span></h2>
      <div class="sub" data-i18n="loginSub"></div>
      <label class="fld" data-i18n="codeLabel2"></label>
      <input type="text" id="loginCode" data-i18n-ph="codePh">
      <button class="btn-solid" id="loginSubmitBtn" data-i18n="loginBtn"></button>
      <div class="toggle-mode">
        <button id="showRegisterBtn" data-i18n="backToRegister"></button>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" class="hidden" style="display:grid; gap:22px;">
    <div class="stamp-card">
      <div class="company-name" id="stampCompanyName"></div>
      <div class="clock mono" id="liveClock">--:--:--</div>
      <div class="date" id="liveDate">-</div>
      <div class="who-row">
        <div>
          <div class="who-name" id="whoName">-</div>
          <div class="who-position" id="whoPosition">-</div>
        </div>
      </div>
      <div class="who-row">
        <button class="switch-link" id="switchUserLink" data-i18n="switchUserLink"></button>
      </div>
      <div class="stamp-actions">
        <button class="stamp-btn btn-in" id="checkInBtn">CHECK IN</button>
        <button class="stamp-btn btn-out" id="checkOutBtn">CHECK OUT</button>
      </div>
      <div class="status-line" id="statusLine"></div>
      <div class="schedule-note" id="scheduleNote"></div>
    </div>

    <div class="card" id="announcementCard">
      <h2 data-i18n="annCardTitle"></h2>
      <div class="sub" data-i18n="annCardSub"></div>
      <ul class="log-list" id="empAnnList"></ul>
    </div>

    <div class="card">
      <h2 data-i18n="todayCardTitle"></h2>
      <div class="sub" data-i18n="todayCardSub"></div>
      <div class="today-grid">
        <div class="today-box"><div class="lbl" data-i18n="checkInLbl"></div><div class="val empty" id="todayIn">--:--</div></div>
        <div class="today-box"><div class="lbl" data-i18n="checkOutLbl"></div><div class="val empty" id="todayOut">--:--</div></div>
        <div class="today-box"><div class="lbl" data-i18n="otLbl"></div><div class="val empty" id="todayOT">--</div></div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="logCardTitle"></h2>
      <div class="sub" data-i18n="logCardSub"></div>
      <textarea id="taskInput" data-i18n-ph="taskPh"></textarea>
      <div class="row">
        <input type="number" id="hoursInput" step="0.5" min="0" data-i18n-ph="hoursPh">
        <button class="btn-solid" id="addLogBtn" data-i18n="addLogBtn"></button>
      </div>
      <ul class="log-list" id="logList"></ul>

      <div class="divider"></div>

      <h2 data-i18n="otCardTitle"></h2>
      <div class="sub" data-i18n="otCardSub"></div>
      <textarea id="otDesc" data-i18n-ph="otDescPh"></textarea>
      <div class="row">
        <input type="number" id="otHours" step="0.5" min="0" data-i18n-ph="otHoursPh">
        <button class="btn-solid ot" id="addOtBtn" data-i18n="addOtBtn"></button>
      </div>
      <div class="sub" style="margin-top:10px;" data-i18n="otApprovalNote"></div>
      <ul class="log-list" id="otList"></ul>

      <div class="divider"></div>

      <h2 data-i18n="haCardTitle"></h2>
      <div class="sub" data-i18n="haCardSub"></div>
      <textarea id="haDesc" data-i18n-ph="haDescPh"></textarea>
      <div class="row">
        <input type="number" id="haAmount" step="100" min="0" data-i18n-ph="haAmountPh">
        <input type="file" id="haPhoto" accept="image/*,application/pdf" style="flex:1; min-width:180px;">
        <button class="btn-solid ot" id="addHaBtn" data-i18n="addHaBtn"></button>
      </div>
      <div class="sub" style="margin-top:10px;" data-i18n="haApprovalNote"></div>
      <ul class="log-list" id="haList"></ul>
    </div>

    <div class="card">
      <h2 data-i18n="leaveCardTitle"></h2>
      <div class="sub" data-i18n="leaveCardSub"></div>
      <div class="grid2">
        <div>
          <label class="fld" data-i18n="leaveTypeLabel"></label>
          <select id="leaveType">
            <option value="annual" data-i18n="leaveAnnual"></option>
            <option value="casual" data-i18n="leaveCasual"></option>
            <option value="sick" data-i18n="leaveSick"></option>
            <option value="unpaid" data-i18n="leaveUnpaid"></option>
            <option value="other" data-i18n="leaveOther"></option>
          </select>
        </div>
        <div style="display:flex; align-items:flex-end;"><div class="balance-note" id="balanceNote">—</div></div>
        <div><label class="fld" data-i18n="startDateLabel"></label><input type="date" id="leaveStart"></div>
        <div><label class="fld" data-i18n="endDateLabel"></label><input type="date" id="leaveEnd"></div>
      </div>
      <div style="margin-top:12px;">
        <label class="fld" data-i18n="reasonLabel"></label>
        <textarea id="leaveReason" style="min-height:60px;" data-i18n-ph="reasonPh"></textarea>
      </div>
      <div class="row"><button class="btn-solid" id="submitLeaveBtn" data-i18n="submitLeaveBtn"></button></div>

function currentLang(){ return localStorage.getItem('hr_lang') || 'my'; }
function t(key, ...args){
  const entry = I18N[currentLang()][key];
  return typeof entry === 'function' ? entry(...args) : (entry ?? key);
}
function applyLanguage(lang){
  localStorage.setItem('hr_lang', lang);
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.getElementById('langMy').classList.toggle('active', lang === 'my');
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  refreshToday();
  renderAll();

async function refreshToday(){
  if(!activeCompanyCode()) return;
  const mainAppEl = document.getElementById('mainApp');
  if(!mainAppEl || mainAppEl.classList.contains('hidden')) return;
  const emp = currentEmployee();
  if(!emp) return;
  const code = activeCompanyCode();
  try {
    const [settingsRows, attRows, otRows] = await Promise.all([
      rpc('get_settings', {p_code: code}),
      rpc('get_my_attendance_today', {p_code: code, p_employee_id: emp.id}),
      rpc('get_my_ot', {p_code: code, p_employee_id: emp.id})
    ]);
    const settings = settingsRows[0] || {standard_check_in:'09:00:00', standard_check_out:'17:00:00', grace_minutes:15};
    const rec = attRows[0] || null;
    const inBox = document.getElementById('todayIn'), outBox = document.getElementById('todayOut'), otBox = document.getElementById('todayOT');

    inBox.textContent = rec && rec.check_in_time ? fmtTime(rec.check_in_time) : '--:--';
    inBox.classList.toggle('empty', !(rec && rec.check_in_time));
    inBox.classList.toggle('warn', !!(rec && rec.status === 'late'));
    outBox.textContent = rec && rec.check_out_time ? fmtTime(rec.check_out_time) : '--:--';
    outBox.classList.toggle('empty', !(rec && rec.check_out_time));

    const approvedTodayOT = (otRows || [])
      .filter(o => o.status === 'approved' && o.work_date === todayStr())
      .reduce((sum,o) => sum + Number(o.hours), 0);
    otBox.textContent = approvedTodayOT > 0 ? approvedTodayOT.toFixed(1) : '--';
    otBox.classList.toggle('empty', approvedTodayOT === 0);
    otBox.classList.toggle('good', approvedTodayOT > 0);

    document.getElementById('checkInBtn').disabled = !!(rec && rec.check_in_time);
    document.getElementById('checkOutBtn').disabled = !(rec && rec.check_in_time) || !!(rec && rec.check_out_time);
    document.getElementById('scheduleNote').textContent = t('scheduleNote', {
      checkIn: fmtTime(settings.standard_check_in), checkOut: fmtTime(settings.standard_check_out), grace: settings.grace_minutes
    });
  } catch(e){ console.error(e); }

  refreshLogs(); refreshOt(); refreshLeaves(); refreshAnnouncements(); refreshHealthAllowance();
}

async function renderDashboard(code, pw){
  try {
    const [rows, leaves] = await Promise.all([
      rpc('admin_today_attendance', {p_code: code, p_password: pw}),
      rpc('admin_list_leaves', {p_code: code, p_password: pw})
    ]);
    const presentCount = rows.filter(r => r.check_in_time).length;
    const pendingLeaves = leaves.filter(l => l.status === 'pending').length;
    document.getElementById('statRow').innerHTML = `
      <div class="stat"><div class="n">${rows.length}</div><div class="l">${t('statTotalEmp')}</div></div>
      <div class="stat"><div class="n">${presentCount}</div><div class="l">${t('statCheckedIn')}</div></div>
      <div class="stat"><div class="n">${rows.length - presentCount}</div><div class="l">${t('statNotCheckedIn')}</div></div>
      <div class="stat"><div class="n">${pendingLeaves}</div><div class="l">${t('statPendingLeave')}</div></div>`;

    const otRows = await rpc('admin_list_ot', {p_code: code, p_password: pw});
    const otToday = otRows.filter(o => o.status === 'approved' && o.work_date === todayStr());
    const tbody = document.querySelector('#dashTable tbody');
    tbody.innerHTML = rows.map(r => {
      const status = r.check_in_time ? r.status : 'absent';
      const ot = otToday.filter(o => o.employee_id === r.employee_id).reduce((s,o) => s + Number(o.hours), 0);
      return `<tr><td class="mono">${r.employee_code}</td><td>${r.full_name}</td><td>${r.position_name}</td>
        <td class="mono">${fmtTime(r.check_in_time) || '—'}</td><td class="mono">${fmtTime(r.check_out_time) || '—'}</td>
        <td><span class="badge ${status}">${statusLabel[status]}</span></td>
        <td class="mono">${ot ? '<span class="ot-tag">'+ot+'</span>' : '—'}</td></tr>`;
    }).join('') || `<tr><td colspan="7" style="color:var(--slate);">${t('emptyEmp')}</td></tr>`;
  } catch(e){ console.error('dashboard', e); }
}

async function renderPositions(code, pw){
  try {
    const positions = await rpc('list_positions', {p_code: code});
    _cachedPositions = positions;
    document.getElementById('posTags').innerHTML = positions.map(p => `
      <div class="pos-tag">${p.position_name}${p.department ? ' · ' + p.department : ''} <button onclick="removePosition(${p.id})">×</button></div>`).join('');
    document.getElementById('empPosition').innerHTML = positions.map(p => `<option>${p.position_name}</option>`).join('');
  } catch(e){ console.error('positions', e); }
}
async function removePosition(id){
  try { await rpc('admin_remove_position', {p_code: adminActiveCompanyCode(), p_password: adminPassword(), p_position_id: id}); renderAll(); }
  catch(e){ alert(e.message); }
}
document.getElementById('addPosBtn').addEventListener('click', async () => {
  const name = document.getElementById('posName').value.trim();
  const dept = document.getElementById('posDept').value.trim();
  if(!name) return;
  try {
    await rpc('admin_add_position', {p_code: adminActiveCompanyCode(), p_password: adminPassword(), p_name: name, p_dept: dept});
    document.getElementById('posName').value = ''; document.getElementById('posDept').value = '';
    renderAll();
  } catch(e){ alert(e.message); }
});

async function loadSettingsForm(code, pw){
  try {
    const rows = await rpc('get_settings', {p_code: code});
    const s = rows[0] || {standard_check_in:'09:00:00', standard_check_out:'17:00:00', grace_minutes:15, ot_pay_rate:2000};
    document.getElementById('setCheckIn').value = fmtTime(s.standard_check_in);
    document.getElementById('setCheckOut').value = fmtTime(s.standard_check_out);
    document.getElementById('setGrace').value = s.grace_minutes;
    document.getElementById('setOtPayRate').value = s.ot_pay_rate;
  } catch(e){ console.error('settings', e); }
}
document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
  try {
    await rpc('admin_update_settings', {
      p_code: adminActiveCompanyCode(), p_password: adminPassword(),
      p_check_in: document.getElementById('setCheckIn').value || '09:00',
      p_check_out: document.getElementById('setCheckOut').value || '17:00',
      p_grace: parseInt(document.getElementById('setGrace').value) || 0,
      p_ot_rate: parseFloat(document.getElementById('setOtPayRate').value) || 0
    });
    const toast = document.getElementById('settingsToast');
    toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000);
    renderAll();
  } catch(e){ alert(e.message); }
});

async function loadQuotaForm(code, pw){
  try {
    const rows = await rpc('get_leave_quotas', {p_code: code});
    const q = rows[0] || {annual_days:3, casual_days:6, sick_days:6, unpaid_days:3, other_days:3};
    document.getElementById('qAnnual').value = q.annual_days;
    document.getElementById('qCasual').value = q.casual_days;
    document.getElementById('qSick').value = q.sick_days;
    document.getElementById('qUnpaid').value = q.unpaid_days;
    document.getElementById('qOther').value = q.other_days;
  } catch(e){ console.error('quotas', e); }
}
document.getElementById('saveQuotaBtn').addEventListener('click', async () => {
  try {
    await rpc('admin_update_leave_quotas', {
      p_code: adminActiveCompanyCode(), p_password: adminPassword(),
      p_annual: parseInt(document.getElementById('qAnnual').value) || 0,
      p_casual: parseInt(document.getElementById('qCasual').value) || 0,
      p_sick: parseInt(document.getElementById('qSick').value) || 0,
      p_unpaid: parseInt(document.getElementById('qUnpaid').value) || 0,
      p_other: parseInt(document.getElementById('qOther').value) || 0
    });
    const toast = document.getElementById('quotaToast');
    toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000);
    renderAll();
  } catch(e){ alert(e.message); }
});

async function renderLogs(code, pw){
  try {
    const rows = await rpc('admin_all_work_logs', {p_code: code, p_password: pw});
    document.querySelector('#logTable tbody').innerHTML = (rows && rows.length) ? rows.map(l => `
      <tr><td>${l.log_date}</td><td>${l.full_name}</td><td>${l.task_description}</td><td class="mono">${l.hours_spent || '—'}</td></tr>`).join('')
      : `<tr><td colspan="4" style="color:var(--slate);">${t('emptyLogs')}</td></tr>`;
  } catch(e){ console.error('logs', e); }
}

async function renderOvertime(code, pw){
  try {
    const rows = await rpc('admin_list_ot', {p_code: code, p_password: pw});
    document.querySelector('#otTable tbody').innerHTML = (rows && rows.length) ? rows.map(o => `
      <tr><td>${o.full_name}</td><td>${o.work_date}</td><td class="mono">${o.hours}</td><td>${o.description}</td>
        <td><span class="badge ${o.status}">${o.status}</span></td>
        <td>${o.status === 'pending' ? `<div class="actions">
          <button class="btn small approve" onclick="reviewOt(${o.id}, 'approved')">${t('approveBtn')}</button>
          <button class="btn small reject" onclick="reviewOt(${o.id}, 'rejected')">${t('rejectBtn')}</button></div>` : '—'}</td></tr>`).join('')
      : `<tr><td colspan="6" style="color:var(--slate);">${t('emptyOt')}</td></tr>`;

    const settings = (await rpc('get_settings', {p_code: code}))[0] || {ot_pay_rate: 0};
    const now = new Date();
    const ym = now.toISOString().slice(0,7);
    const monthLabel = now.toLocaleDateString(currentLang() === 'my' ? 'en-GB' : 'en-US', {month:'long', year:'numeric'});
    document.getElementById('otMonthlyHint').textContent = (currentLang() === 'my' ? 'ရက်စွဲအပိုင်းအခြား — ' : 'Period — ') + monthLabel;

    const approvedThisMonth = rows.filter(o => o.status === 'approved' && o.work_date.slice(0,7) === ym);
    const byEmp = {};
    approvedThisMonth.forEach(o => { byEmp[o.full_name] = byEmp[o.full_name] || {name: o.full_name, hours: 0}; byEmp[o.full_name].hours += Number(o.hours); });
    const empIds = Object.keys(byEmp);
    document.querySelector('#otMonthlyTable tbody').innerHTML = empIds.length ? empIds.map(id => {
      const hours = byEmp[id].hours, pay = hours * settings.ot_pay_rate;
      return `<tr><td>${byEmp[id].name}</td><td class="mono">${hours.toFixed(1)}</td><td class="mono">${fmtMoney(settings.ot_pay_rate)}</td><td class="mono">${fmtMoney(pay)}</td></tr>`;
    }).join('') : `<tr><td colspan="4" style="color:var(--slate);">${t('emptyOt')}</td></tr>`;
  } catch(e){ console.error('overtime', e); }
}
async function reviewOt(id, status){
  try { await rpc('admin_review_ot', {p_code: adminActiveCompanyCode(), p_password: adminPassword(), p_ot_id: id, p_status: status}); renderAll(); }
  catch(e){ alert(e.message); }
}

async function renderLeaves(code, pw){
  const typeLabelMap = {annual:'Annual', casual:'Casual', sick:'Sick', unpaid:'Unpaid', other:'Other'};
  try {
    const rows = await rpc('admin_list_leaves', {p_code: code, p_password: pw});
    document.querySelector('#leaveTable tbody').innerHTML = (rows && rows.length) ? rows.map(l => `
      <tr><td>${l.full_name}</td><td>${typeLabelMap[l.leave_type]}</td><td class="mono">${l.start_date} → ${l.end_date}</td>
        <td>${l.reason || '—'}</td><td><span class="badge ${l.status}">${l.status}</span></td>
        <td>${l.status === 'pending' ? `<div class="actions">
          <button class="btn small approve" onclick="reviewLeave(${l.id}, 'approved')">${t('approveBtn')}</button>
          <button class="btn small reject" onclick="reviewLeave(${l.id}, 'rejected')">${t('rejectBtn')}</button></div>` : '—'}</td></tr>`).join('')
      : `<tr><td colspan="6" style="color:var(--slate);">${t('emptyLeaves')}</td></tr>`;
  } catch(e){ console.error('leaves', e); }
}
async function reviewLeave(id, status){
  try { await rpc('admin_review_leave', {p_code: adminActiveCompanyCode(), p_password: adminPassword(), p_leave_id: id, p_status: status}); renderAll(); }
  catch(e){ alert(e.message); }
}

async function renderBalances(code, pw){
  try {
    const rows = await rpc('admin_leave_balances', {p_code: code, p_password: pw});
    const byName = {};
    rows.forEach(r => { byName[r.full_name] = byName[r.full_name] || {}; byName[r.full_name][r.leave_type] = `${r.used}/${r.quota}${r.used >= r.quota ? ' ⛔' : ''}`; });
    const types = ['annual','casual','sick','unpaid','other'];
    const names = Object.keys(byName);
    document.querySelector('#balanceTable tbody').innerHTML = names.length ? names.map(name => `
      <tr><td>${name}</td>${types.map(ty => `<td class="mono">${byName[name][ty] || '—'}</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="6" style="color:var(--slate);">${t('emptyEmp')}</td></tr>`;
  } catch(e){ console.error('balances', e); }
}

async function renderAnnouncements(code, pw){
  try {
    const list = await rpc('list_announcements', {p_code: code});
    document.getElementById('adminAnnList').innerHTML = (list && list.length) ? list.map(a => `
      <li style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start;">
        <span>${a.message}<div class="meta">${new Date(a.posted_at).toLocaleString(currentLang() === 'my' ? 'en-GB' : 'en-US')}</div></span>
        <button class="btn small ghost" onclick="deleteAnnouncement(${a.id})">${t('deleteBtn')}</button>
      </li>`).join('') : `<li style="border-left-color:var(--line); color:var(--slate);">${t('emptyAnn')}</li>`;
  } catch(e){ console.error('announcements', e); }
}
document.getElementById('postAnnBtn').addEventListener('click', async () => {
  const message = document.getElementById('annMessage').value.trim();
  if(!message) return;
  try {
    await rpc('admin_post_announcement', {p_code: adminActiveCompanyCode(), p_password: adminPassword(), p_message: message});
    document.getElementById('annMessage').value = '';
    renderAll();
  } catch(e){ alert(e.message); }
});
async function deleteAnnouncement(id){
  try { await rpc('admin_delete_announcement', {p_code: adminActiveCompanyCode(), p_password: adminPassword(), p_announcement_id: id}); renderAll(); }
  catch(e){ alert(e.message); }
}

async function renderHealthAllowanceAdmin(code, pw){
  try {
    const rows = await rpc('admin_list_health_allowance', {p_code: code, p_password: pw});
    document.querySelector('#haTable tbody').innerHTML = (rows && rows.length) ? rows.map(h => `
      <tr><td>${h.full_name}</td><td>${h.request_date}</td><td>${h.description}</td>
        <td class="mono">${h.amount ? fmtMoney(h.amount) : '—'}</td>
        <td><a href="${h.photo_url}" target="_blank" rel="noopener">${t('viewPhotoLink')}</a></td>
        <td><span class="badge ${h.status}">${h.status}</span></td>
        <td>${h.status === 'pending' ? `<div class="actions">
          <button class="btn small approve" onclick="reviewHa(${h.id}, 'approved')">${t('approveBtn')}</button>
          <button class="btn small reject" onclick="reviewHa(${h.id}, 'rejected')">${t('rejectBtn')}</button></div>` : '—'}</td></tr>`).join('')
      : `<tr><td colspan="7" style="color:var(--slate);">${t('haEmpty')}</td></tr>`;
  } catch(e){ console.error('health allowance', e); }
}
async function reviewHa(id, status){
  try { await rpc('admin_review_health_allowance', {p_code: adminActiveCompanyCode(), p_password: adminPassword(), p_id: id, p_status: status}); renderAll(); }
  catch(e){ alert(e.message); }
}

async function renderAll(){
  if(document.getElementById('adminSection').classList.contains('hidden')) return;
  if(document.getElementById('appShell').classList.contains('hidden')) return;
  const code = adminActiveCompanyCode(), pw = adminPassword();
  if(!code || !pw) return;
  await Promise.all([
    renderDashboard(code, pw), renderAttendance(code, pw), renderEmployees(code, pw), renderPositions(code, pw),
    loadSettingsForm(code, pw), loadQuotaForm(code, pw), renderLogs(code, pw), renderOvertime(code, pw),
    renderLeaves(code, pw), renderBalances(code, pw), renderAnnouncements(code, pw), renderHealthAllowanceAdmin(code, pw)
  ]);
}

/* --- Boot --- */
(async function boot(){
  applyLanguage(currentLang());

  if(activeCompanyCode()){
    try {
      const rows = await rpc('get_company_info', {p_code: activeCompanyCode()});
      if(rows && rows.length){ localStorage.setItem('hr_active_company_name', rows[0].company_name); await enterCompany(); }
      else { showCompanyGate(); }
    } catch(e){ showCompanyGate(); }
  } else {
    showCompanyGate();
  }

  if(adminActiveCompanyCode() && adminPassword()){
    try {
      const rows = await rpc('admin_login', {p_code: adminActiveCompanyCode(), p_password: adminPassword()});
      if(rows && rows.length){ await enterAdmin(); }
    } catch(e){ /* stale session — leave the gate showing */ }
  }
})();

setInterval(() => { if(!document.getElementById('adminSection').classList.contains('hidden')) renderAll(); }, 8000);
setInterval(() => {
  const mainAppEl = document.getElementById('mainApp');
  if(mainAppEl && !mainAppEl.classList.contains('hidden')) refreshAnnouncements();
}, 8000);
</script>
